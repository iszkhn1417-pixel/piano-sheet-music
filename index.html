<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ピアノ楽譜ファインダー</title>
  <style>
    :root {
      --bg: #f6f4f0;
      --surface: #ffffff;
      --surface-alt: #faf8f5;
      --text: #1f2421;
      --muted: #66706a;
      --primary: #2d5a47;
      --primary-hover: #224536;
      --primary-soft: #e6f0eb;
      --accent: #b86b35;
      --accent-soft: #fbf0e8;
      --border: #e3dfd7;
      --danger: #b43b3b;
      --shadow: 0 6px 20px rgba(24, 34, 28, 0.06);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 88px;
    }

    header.app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(246, 244, 240, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 780px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand p {
      margin: 0;
      font-size: 11.5px;
      color: var(--muted);
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .sync-pill:hover {
      background: var(--surface-alt);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9aa39e;
      flex-shrink: 0;
    }

    .sync-dot.connected {
      background: #22a06b;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 18px 16px 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .card-title {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 700;
    }

    .card-sub {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .field {
      margin-bottom: 15px;
    }

    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 90, 71, 0.12);
    }

    .book-suggestions {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .chip.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, transform 0.05s;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 14px;
      font-size: 13px;
    }

    .btn-secondary:hover {
      background: #efeae2;
    }

    .btn-danger-ghost {
      background: transparent;
      color: var(--danger);
      border: 1px solid #f0c9c9;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-danger-ghost:hover {
      background: #fdf2f2;
    }

    .toast {
      margin-top: 12px;
      padding: 11px 14px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 600;
      display: none;
    }

    .toast.show {
      display: block;
    }

    .toast.success {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #c3dccf;
    }

    .toast.error {
      background: #fdf2f2;
      color: var(--danger);
      border: 1px solid #f0c9c9;
    }

    /* 検索結果 */
    .search-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 600px) {
      .search-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .result-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      background: var(--surface-alt);
      margin-bottom: 12px;
    }

    .result-headline {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .result-location {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--primary);
    }

    .maybe-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }

    .maybe-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .maybe-card {
      background: var(--accent-soft);
      border: 1px solid #f0d5c0;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .maybe-card .result-location {
      color: #8f4d1e;
    }

    /* 一覧タブ */
    .subtabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--surface-alt);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .subtab-btn {
      border: none;
      background: transparent;
      padding: 9px 8px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
    }

    .subtab-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .accordion-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .accordion-trigger {
      width: 100%;
      border: none;
      background: var(--surface);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }

    .accordion-trigger:hover {
      background: var(--surface-alt);
    }

    .accordion-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .chev {
      font-size: 12px;
      color: var(--muted);
      transition: transform 0.2s;
    }

    .accordion-item.open .chev {
      transform: rotate(180deg);
    }

    .accordion-panel {
      display: none;
      padding: 0 16px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface-alt);
    }

    .accordion-item.open .accordion-panel {
      display: block;
    }

    .detail-row {
      padding: 10px 0;
      border-bottom: 1px solid #ece8e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .detail-row:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }

    .detail-main {
      font-size: 13.5px;
    }

    .detail-sub {
      color: var(--muted);
      font-size: 12.5px;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 14px;
    }

    /* 下部ナビゲーション */
    nav.bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: var(--surface);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.05);
    }

    .bottom-nav-inner {
      max-width: 780px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .nav-btn {
      border: none;
      background: transparent;
      padding: 10px 6px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-btn .nav-icon {
      font-size: 19px;
      line-height: 1;
    }

    .nav-btn.active {
      color: var(--primary);
      background: linear-gradient(to top, rgba(45, 90, 71, 0.08), transparent);
    }

    /* モーダル（Google同期設定） */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 22, 18, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .close-btn {
      border: none;
      background: var(--surface-alt);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .help-box {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px;
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .help-box code {
      background: #eae5dc;
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--text);
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">♪</div>
        <div>
          <h1>ピアノ楽譜ファインダー</h1>
          <p id="statusSub">ローカル保存モード</p>
        </div>
      </div>
      <button type="button" class="sync-pill" id="openSyncModalBtn">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncBtnLabel">Google同期</span>
      </button>
    </div>
  </header>

  <main>
    <!-- 登録タブ -->
    <section id="view-register" class="tab-view">
      <div class="card">
        <h2 class="card-title">楽譜・曲を登録</h2>
        <p class="card-sub">楽譜の名前、曲名、作曲者、ページ数を入力して登録します。</p>

        <form id="registerForm" novalidate>
          <div class="field">
            <label class="field-label" for="bookInput">楽譜の名前</label>
            <input type="text" id="bookInput" placeholder="例：ブルクミュラー25の練習曲" autocomplete="off" />
            <div class="book-suggestions" id="bookSuggestions"></div>
          </div>

          <div class="field">
            <label class="field-label" for="songInput">曲名</label>
            <input type="text" id="songInput" placeholder="例：アラベスク" autocomplete="off" />
          </div>

          <div class="field">
            <label class="field-label" for="composerInput">作曲者</label>
            <input type="text" id="composerInput" placeholder="例：ブルクミュラー" autocomplete="off" />
          </div>

          <div class="field">
            <label class="field-label" for="pageInput">ページ（数字のみ）</label>
            <input type="number" id="pageInput" min="1" step="1" inputmode="numeric" placeholder="例：12" />
          </div>

          <button type="submit" class="btn btn-primary">登録する</button>
          <div id="registerToast" class="toast" role="status"></div>
        </form>
      </div>
    </section>

    <!-- 検索タブ -->
    <section id="view-search" class="tab-view" style="display:none;">
      <div class="card">
        <h2 class="card-title">曲名・作曲者から検索</h2>
        <p class="card-sub">どちらか一方だけでも、両方組み合わせても検索できます。</p>

        <div class="search-grid">
          <div class="field" style="margin-bottom:0;">
            <label class="field-label" for="searchSongInput">曲名</label>
            <input type="text" id="searchSongInput" placeholder="例：子犬のワルツ" autocomplete="off" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label class="field-label" for="searchComposerInput">作曲者</label>
            <input type="text" id="searchComposerInput" placeholder="例：ショパン" autocomplete="off" />
          </div>
        </div>

        <div style="display:flex; gap:8px; margin-top:14px;">
          <button type="button" class="btn btn-primary" id="searchBtn">検索する</button>
          <button type="button" class="btn btn-secondary" id="clearSearchBtn">クリア</button>
        </div>
      </div>

      <div class="card" id="searchResultsCard">
        <h3 class="card-title">検索結果</h3>
        <p class="card-sub" id="searchHint">曲名または作曲者を入力して「検索する」を押してください。</p>
        <div id="exactResults"></div>
        <div id="maybeResults"></div>
      </div>
    </section>

    <!-- 一覧タブ -->
    <section id="view-list" class="tab-view" style="display:none;">
      <div class="card">
        <h2 class="card-title">登録済み一覧</h2>
        <p class="card-sub">項目をタップすると詳細が展開されます。</p>

        <div class="subtabs" role="tablist">
          <button type="button" class="subtab-btn active" data-subtab="songs">曲名一覧</button>
          <button type="button" class="subtab-btn" data-subtab="composers">作曲者一覧</button>
          <button type="button" class="subtab-btn" data-subtab="books">楽譜一覧</button>
        </div>

        <div id="listContainer"></div>
      </div>
    </section>
  </main>

  <!-- 下部タブ -->
  <nav class="bottom-nav" aria-label="メインメニュー">
    <div class="bottom-nav-inner">
      <button type="button" class="nav-btn active" data-tab="register">
        <span class="nav-icon">＋</span>
        <span>登録</span>
      </button>
      <button type="button" class="nav-btn" data-tab="search">
        <span class="nav-icon">🔍</span>
        <span>検索</span>
      </button>
      <button type="button" class="nav
